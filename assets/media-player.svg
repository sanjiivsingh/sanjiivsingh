<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C4FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    /* Equalizer Bar Animations */
    @keyframes bounce1 { 0%, 100% { height: 8px; y: 24px; } 50% { height: 22px; y: 10px; } }
    @keyframes bounce2 { 0%, 100% { height: 20px; y: 12px; } 50% { height: 9px; y: 23px; } }
    @keyframes bounce3 { 0%, 100% { height: 12px; y: 20px; } 50% { height: 24px; y: 8px; } }
    @keyframes bounce4 { 0%, 100% { height: 24px; y: 8px; } 50% { height: 10px; y: 22px; } }
    @keyframes bounce5 { 0%, 100% { height: 15px; y: 17px; } 50% { height: 23px; y: 9px; } }
    
    @keyframes playPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 10px #38BDF8); }
    }

    @keyframes liveBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .play-btn {
      transform-origin: 140px 120px;
      animation: playPulse 3s ease-in-out infinite;
      cursor: pointer;
    }

    .live-dot {
      animation: liveBlink 1.8s infinite;
    }

    .bar1 { animation: bounce1 1.2s ease-in-out infinite; }
    .bar2 { animation: bounce2 1.4s ease-in-out infinite 0.2s; }
    .bar3 { animation: bounce3 1.1s ease-in-out infinite 0.4s; }
    .bar4 { animation: bounce4 1.5s ease-in-out infinite 0.1s; }
    .bar5 { animation: bounce5 1.3s ease-in-out infinite 0.3s; }
    .bar6 { animation: bounce2 1.2s ease-in-out infinite 0.5s; }
    .bar7 { animation: bounce4 1.4s ease-in-out infinite 0.2s; }
    .bar8 { animation: bounce1 1.1s ease-in-out infinite 0.6s; }
    .bar9 { animation: bounce3 1.6s ease-in-out infinite 0.3s; }
    .bar10 { animation: bounce5 1.2s ease-in-out infinite 0.1s; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="236" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="2" y="2" width="846" height="236" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Top Console Header Bar -->
  <rect x="2" y="2" width="846" height="36" rx="14" fill="#0f172a" fill-opacity="0.7"/>
  <line x1="2" y1="38" x2="848" y2="38" stroke="#334155" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="24" cy="20" r="5" fill="#EF4444"/>
  <circle cx="40" cy="20" r="5" fill="#F59E0B"/>
  <circle cx="56" cy="20" r="5" fill="#10B981"/>

  <!-- Top Title / Status -->
  <circle class="live-dot" cx="80" cy="20" r="4" fill="#38BDF8"/>
  <text x="92" y="24" fill="#94A3B8" font-size="11" font-weight="600" class="mono" letter-spacing="1">CONSOLE // MEDIA_LOUNGE • EXECUTIVE_INTRO_AND_AMBIENT_FOCUS.stream</text>
  <rect x="750" y="11" width="76" height="18" rx="4" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="0.8"/>
  <text x="788" y="23" fill="#38BDF8" font-size="10" font-weight="700" class="mono" text-anchor="middle">1080p HD</text>

  <!-- Left Video Thumbnail / Holographic Screen Simulation -->
  <g transform="translate(30, 52)">
    <!-- Video Box -->
    <rect x="0" y="0" width="220" height="135" rx="8" fill="#050811" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.8"/>
    
    <!-- Grid Pattern inside video -->
    <line x1="0" y1="45" x2="220" y2="45" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="0" y1="90" x2="220" y2="90" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="73" y1="0" x2="73" y2="135" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="146" y1="0" x2="146" y2="135" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3,3"/>

    <!-- Subtle radar ring in center -->
    <circle cx="110" cy="67" r="42" fill="none" stroke="#0284C7" stroke-width="0.8" stroke-opacity="0.3"/>
    <circle cx="110" cy="67" r="28" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Play Button Group with pulsing animation -->
    <g class="play-btn">
      <circle cx="110" cy="67" r="22" fill="#0078D4" fill-opacity="0.9" stroke="#38BDF8" stroke-width="2"/>
      <polygon points="104,57 122,67 104,77" fill="#FFFFFF"/>
    </g>

    <!-- Video Subtitle Badge -->
    <rect x="10" y="105" width="115" height="20" rx="4" fill="#0B132B" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
    <text x="18" y="119" fill="#E2E8F0" font-size="9" font-weight="600" class="mono">▶ INTRO VIDEO (2:15)</text>

    <!-- Cloud Tag -->
    <rect x="155" y="10" width="55" height="16" rx="3" fill="#0078D4" fill-opacity="0.3"/>
    <text x="182" y="21" fill="#38BDF8" font-size="8" font-weight="700" class="mono" text-anchor="middle">AZURE IaC</text>
  </g>

  <!-- Right Side: Content Details & Audio Equalizer Player -->
  <g transform="translate(275, 52)">
    <!-- Main Headline -->
    <text x="0" y="24" fill="#F8FAFC" font-size="17" font-weight="700" class="sans" letter-spacing="0.3">
      Executive Video Intro &amp; Continuous Tech Ambient Sound
    </text>

    <!-- Subtitle description -->
    <text x="0" y="46" fill="#94A3B8" font-size="12" font-weight="400" class="sans">
      Tour my production Azure Landing Zones, DevSecOps pipelines, and modular IaC frameworks.
    </text>
    <text x="0" y="64" fill="#64748B" font-size="11" font-weight="400" class="sans">
      Featuring continuous cyber ambient background music tailored for deep technical immersion.
    </text>

    <!-- Audio Equalizer Spectrum Visualizer -->
    <g transform="translate(0, 78)">
      <rect x="0" y="0" width="540" height="42" rx="6" fill="#0B132B" stroke="#1E293B" stroke-width="1"/>
      
      <!-- Speaker Icon -->
      <path d="M16 16 L22 16 L29 11 L29 31 L22 26 L16 26 Z" fill="#38BDF8"/>
      <path d="M33 16 Q37 21 33 26" stroke="#38BDF8" stroke-width="1.8" fill="none"/>
      <path d="M36 12 Q42 21 36 30" stroke="#38BDF8" stroke-width="1.8" fill="none" opacity="0.6"/>

      <!-- Soundwave Bars -->
      <g fill="#38BDF8">
        <rect class="bar1" x="52"  y="22" width="3.5" height="10" rx="1.5" />
        <rect class="bar2" x="60"  y="14" width="3.5" height="18" rx="1.5" />
        <rect class="bar3" x="68"  y="18" width="3.5" height="14" rx="1.5" />
        <rect class="bar4" x="76"  y="12" width="3.5" height="20" rx="1.5" />
        <rect class="bar5" x="84"  y="16" width="3.5" height="16" rx="1.5" />
        <rect class="bar6" x="92"  y="10" width="3.5" height="22" rx="1.5" />
        <rect class="bar7" x="100" y="15" width="3.5" height="17" rx="1.5" />
        <rect class="bar8" x="108" y="11" width="3.5" height="21" rx="1.5" />
        <rect class="bar9" x="116" y="20" width="3.5" height="12" rx="1.5" />
        <rect class="bar10" x="124" y="13" width="3.5" height="19" rx="1.5" />
        <rect class="bar2" x="132" y="16" width="3.5" height="16" rx="1.5" />
        <rect class="bar5" x="140" y="10" width="3.5" height="22" rx="1.5" />
      </g>

      <!-- Now Playing Label -->
      <text x="156" y="24" fill="#38BDF8" font-size="10" font-weight="700" class="mono">SOUNDTRACK // CYBER TECH AMBIENT FOCUS (432Hz)</text>
      <text x="156" y="34" fill="#64748B" font-size="8.5" class="mono">LOW-LATENCY • ZERO DISTRACTIONS • INFINITE LOOP</text>

      <!-- Audio badge -->
      <rect x="445" y="11" width="82" height="20" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="0.8"/>
      <circle cx="457" cy="21" r="3" fill="#10B981"/>
      <text x="495" y="24" fill="#10B981" font-size="9" font-weight="700" class="mono" text-anchor="middle">STREAM ACTIVE</text>
    </g>

    <!-- Interactive Launch Buttons Hint -->
    <g transform="translate(0, 128)">
      <text x="0" y="16" fill="#38BDF8" font-size="11" font-weight="600" class="mono">
        ⚡ CLICK BELOW TO LAUNCH VIDEO &amp; ACTIVATE BACKGROUND SOUNDTRACK ⤵
      </text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="20" y1="238" x2="830" y2="238" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.7"/>
</svg>
