<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 270" width="100%" height="100%">
  <defs>
    <!-- Card Shadow Filter -->
    <filter id="cardShadowLight" x="-2%" y="-5%" width="104%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <!-- Header Gradient -->
    <linearGradient id="titleGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#0078d4" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="lineGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4" />
      <stop offset="25%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <style>
    .flow-line {
      stroke: url(#lineGradLight);
      stroke-width: 2.2;
      stroke-dasharray: 6 5;
      animation: dashStream 2s linear infinite;
    }
    @keyframes dashStream {
      to {
        stroke-dashoffset: -22;
      }
    }

    .pulse-dot {
      animation: pulseGlow 2s ease-in-out infinite;
    }
    .p-d1 { animation-delay: 0.0s; }
    .p-d2 { animation-delay: 0.3s; }
    .p-d3 { animation-delay: 0.6s; }
    .p-d4 { animation-delay: 0.9s; }
    .p-d5 { animation-delay: 1.2s; }
    .p-d6 { animation-delay: 1.5s; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; r: 3; }
      50% { opacity: 1; r: 4.5; }
    }

    .stage-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }
    .stage-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 9px;
      font-weight: 600;
      fill: #64748b;
    }
    .badge-pill {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 8.5px;
      font-weight: 600;
      fill: #1e293b;
    }
    .header-main {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      fill: #0f172a;
    }
    .header-meta {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 9.5px;
      font-weight: 600;
      fill: #0284c7;
      letter-spacing: 0.5px;
    }
    .status-badge {
      font-family: ui-monospace, monospace;
      font-size: 8px;
      font-weight: 700;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="976" height="266" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadowLight)" />

  <!-- Top Title Bar -->
  <g transform="translate(25, 26)">
    <circle cx="5" cy="5" r="4" fill="#10b981" />
    <circle cx="5" cy="5" r="7" fill="none" stroke="#10b981" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="4;8;4" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="22" y="9" class="header-main">AUTOMATED SHIFT-LEFT DEVSECOPS DELIVERY LIFECYCLE</text>
    <rect x="740" y="-3" width="200" height="18" rx="9" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <text x="752" y="9" class="header-meta">● ZERO-TRUST PIPELINE SPEC</text>
  </g>

  <!-- Global Flow Connector Behind Cards -->
  <path d="M 20 150 L 960 150" class="flow-line" />

  <!-- Inter-stage Arrow Connectors in Gaps -->
  <g transform="translate(160, 142)">
    <path d="M 4 8 L 14 8 M 10 4 L 15 8 L 10 12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g transform="translate(320, 142)">
    <path d="M 4 8 L 14 8 M 10 4 L 15 8 L 10 12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g transform="translate(480, 142)">
    <path d="M 4 8 L 14 8 M 10 4 L 15 8 L 10 12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g transform="translate(640, 142)">
    <path d="M 4 8 L 14 8 M 10 4 L 15 8 L 10 12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <g transform="translate(800, 142)">
    <path d="M 4 8 L 14 8 M 10 4 L 15 8 L 10 12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- STAGE 1: SCM & AUTH (x=20) -->
  <g transform="translate(20, 68)">
    <rect x="0" y="0" width="140" height="156" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
    <path d="M 0 9 Q 0 0 9 0 L 131 0 Q 140 0 140 9 L 140 24 L 0 24 Z" fill="#0078d4" />
    <text x="10" y="16" class="stage-title">01 • SCM &amp; AUTH</text>
    <circle cx="128" cy="12" class="pulse-dot p-d1" fill="#bae6fd" />

    <text x="10" y="40" class="stage-sub">Version Control &amp; Auth</text>
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Git / GitHub PR</text>
    </g>
    <g transform="translate(10, 73)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Azure OIDC Login</text>
    </g>
    <g transform="translate(10, 98)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Branch Protection</text>
    </g>

    <!-- Stage Status Bar -->
    <rect x="10" y="128" width="120" height="18" rx="4" fill="#f0f9ff" />
    <text x="16" y="140" class="status-badge" fill="#0284c7">● OIDC AUTH READY</text>
  </g>

  <!-- STAGE 2: PRE-FLIGHT (x=180) -->
  <g transform="translate(180, 68)">
    <rect x="0" y="0" width="140" height="156" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
    <path d="M 0 9 Q 0 0 9 0 L 131 0 Q 140 0 140 9 L 140 24 L 0 24 Z" fill="#7c3aed" />
    <text x="10" y="16" class="stage-title">02 • PRE-FLIGHT</text>
    <circle cx="128" cy="12" class="pulse-dot p-d2" fill="#ddd6fe" />

    <text x="10" y="40" class="stage-sub">Syntax &amp; Secrets Scan</text>
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">TFLint Validation</text>
    </g>
    <g transform="translate(10, 73)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Gitleaks Detection</text>
    </g>
    <g transform="translate(10, 98)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Terraform Format</text>
    </g>

    <rect x="10" y="128" width="120" height="18" rx="4" fill="#f5f3ff" />
    <text x="16" y="140" class="status-badge" fill="#7c3aed">● SYNTAX VERIFIED</text>
  </g>

  <!-- STAGE 3: SHIFT-LEFT SAST (x=340) -->
  <g transform="translate(340, 68)">
    <rect x="0" y="0" width="140" height="156" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
    <path d="M 0 9 Q 0 0 9 0 L 131 0 Q 140 0 140 9 L 140 24 L 0 24 Z" fill="#dc2626" />
    <text x="10" y="16" class="stage-title">03 • SHIFT-LEFT SAST</text>
    <circle cx="128" cy="12" class="pulse-dot p-d3" fill="#fecaca" />

    <text x="10" y="40" class="stage-sub">IaC Security Baselines</text>
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Checkov Policies</text>
    </g>
    <g transform="translate(10, 73)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">tfsec Deep Scan</text>
    </g>
    <g transform="translate(10, 98)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">SonarQube Gates</text>
    </g>

    <rect x="10" y="128" width="120" height="18" rx="4" fill="#fef2f2" />
    <text x="16" y="140" class="status-badge" fill="#dc2626">● CIS AUDIT PASSED</text>
  </g>

  <!-- STAGE 4: PLAN & STATE (x=500) -->
  <g transform="translate(500, 68)">
    <rect x="0" y="0" width="140" height="156" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
    <path d="M 0 9 Q 0 0 9 0 L 131 0 Q 140 0 140 9 L 140 24 L 0 24 Z" fill="#0284c7" />
    <text x="10" y="16" class="stage-title">04 • PLAN &amp; STATE</text>
    <circle cx="128" cy="12" class="pulse-dot p-d4" fill="#bae6fd" />

    <text x="10" y="40" class="stage-sub">Remote State Locking</text>
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Terraform Plan</text>
    </g>
    <g transform="translate(10, 73)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Azure Blob Lock</text>
    </g>
    <g transform="translate(10, 98)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Artifact Spec</text>
    </g>

    <rect x="10" y="128" width="120" height="18" rx="4" fill="#f0f9ff" />
    <text x="16" y="140" class="status-badge" fill="#0284c7">● LEASE LOCKED</text>
  </g>

  <!-- STAGE 5: GATES & IMAGES (x=660) -->
  <g transform="translate(660, 68)">
    <rect x="0" y="0" width="140" height="156" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
    <path d="M 0 9 Q 0 0 9 0 L 131 0 Q 140 0 140 9 L 140 24 L 0 24 Z" fill="#d97706" />
    <text x="10" y="16" class="stage-title">05 • GATES &amp; IMAGES</text>
    <circle cx="128" cy="12" class="pulse-dot p-d5" fill="#fde68a" />

    <text x="10" y="40" class="stage-sub">Vulnerability &amp; Sign-off</text>
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Manual Sign-off</text>
    </g>
    <g transform="translate(10, 73)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Trivy CVE Scan</text>
    </g>
    <g transform="translate(10, 98)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Azure ACR Push</text>
    </g>

    <rect x="10" y="128" width="120" height="18" rx="4" fill="#fffbeb" />
    <text x="16" y="140" class="status-badge" fill="#d97706">● GATE APPROVED</text>
  </g>

  <!-- STAGE 6: LIVE CLOUD (x=820) -->
  <g transform="translate(820, 68)">
    <rect x="0" y="0" width="140" height="156" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
    <path d="M 0 9 Q 0 0 9 0 L 131 0 Q 140 0 140 9 L 140 24 L 0 24 Z" fill="#10b981" />
    <text x="10" y="16" class="stage-title">06 • LIVE CLOUD</text>
    <circle cx="128" cy="12" class="pulse-dot p-d6" fill="#a7f3d0" />

    <text x="10" y="40" class="stage-sub">Kubernetes &amp; Monitoring</text>
    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">AKS Kubernetes</text>
    </g>
    <g transform="translate(10, 73)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Azure VMs / VNet</text>
    </g>
    <g transform="translate(10, 98)">
      <rect x="0" y="0" width="120" height="20" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
      <text x="8" y="14" class="badge-pill">Azure Monitor / KQL</text>
    </g>

    <rect x="10" y="128" width="120" height="18" rx="4" fill="#ecfdf5" />
    <text x="16" y="140" class="status-badge" fill="#059669">● PRODUCTION LIVE</text>
  </g>

  <!-- Bottom Console Status Bar -->
  <g transform="translate(25, 238)">
    <rect x="0" y="0" width="930" height="20" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="12" y="13" font-family="ui-monospace, monospace" font-size="9" fill="#475569">LIFECYCLE: <tspan fill="#059669" font-weight="700">● RUNNING</tspan> | GUARDRAILS: <tspan fill="#0284c7" font-weight="700">ENFORCED (CHECKOV + TFSEC + TRIVY)</tspan> | CONTROLS: <tspan fill="#d97706" font-weight="700">MANUAL APPROVAL</tspan> | TARGET: <tspan fill="#059669" font-weight="700">AZURE PRODUCTION</tspan></text>
  </g>
</svg>