<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" width="100%" height="100">
  <defs>
    <!-- Card Shadow Filter -->
    <filter id="radarShadow" x="-3%" y="-8%" width="106%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>

    <linearGradient id="streamGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4" />
      <stop offset="30%" stop-color="#7c3aed" />
      <stop offset="70%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <style>
    .radar-card {
      fill: #ffffff;
      stroke: #e2e8f0;
      stroke-width: 1.5;
      rx: 14px;
    }

    /* Live Beacon Pulse */
    @keyframes pulseGlowRadar {
      0%, 100% {
        r: 4.5px;
        opacity: 1;
      }
      50% {
        r: 8px;
        opacity: 0.35;
      }
    }
    .beacon-pulse {
      animation: pulseGlowRadar 2s ease-in-out infinite;
      fill: #10b981;
    }
    .beacon-core {
      fill: #059669;
    }

    /* Subtle Progress Stream Bar */
    @keyframes streamProgressLight {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    .stream-line {
      stroke: url(#streamGradLight);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 600;
      animation: streamProgressLight 4s linear infinite;
    }

    .label-dark {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #334155;
      letter-spacing: 0.6px;
    }
    .pill-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 700;
      font-size: 12px;
      fill: #0f172a;
    }
    .pill-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 10px;
      fill: #64748b;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="3" width="1196" height="94" class="radar-card" filter="url(#radarShadow)" />

  <!-- Animated Top Stream Accent -->
  <line x1="24" y1="3" x2="1176" y2="3" class="stream-line" />

  <!-- Top Row: Status Beacon + Verified Credentials Badge -->
  <!-- Left: Live Status -->
  <g transform="translate(32, 22)">
    <circle cx="6" cy="6" r="6" class="beacon-pulse" />
    <circle cx="6" cy="6" r="3.5" class="beacon-core" />
    <text x="22" y="10" class="label-dark">LIVE ARCHITECTURE RADAR :</text>
    <rect x="195" y="-1" width="186" height="19" rx="9.5" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="207" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="9.5" fill="#065f46">● OPEN FOR CLIENT PROJECTS</text>
  </g>

  <!-- Right: Verified Heritage Badge -->
  <g transform="translate(860, 20)">
    <rect x="0" y="0" width="308" height="23" rx="11.5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="14" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="10" fill="#334155">
      10+ Yrs Exp <tspan fill="#94a3b8">•</tspan> 5+ Yrs Cloud <tspan fill="#94a3b8">•</tspan> State Bank of India Heritage
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="32" y1="46" x2="1168" y2="46" stroke="#f1f5f9" stroke-width="1" />

  <!-- Bottom Row: 4 Specialization Focus Pillars (Scannable, No Overlap Bug) -->
  <g transform="translate(32, 54)">
    <!-- Pillar 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="268" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="0" y="0" width="4" height="34" rx="2" fill="#0078d4" />
      <text x="14" y="15" class="pill-title">Azure Landing Zones (CAF)</text>
      <text x="14" y="27" class="pill-sub">Hub-and-Spoke · Firewall · UDR 0.0.0.0/0</text>
    </g>

    <!-- Pillar 2 -->
    <g transform="translate(290, 0)">
      <rect x="0" y="0" width="268" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="0" y="0" width="4" height="34" rx="2" fill="#7c3aed" />
      <text x="14" y="15" class="pill-title">Modular Terraform (1.9+)</text>
      <text x="14" y="27" class="pill-sub">11+ Reusable Child Modules · State Locking</text>
    </g>

    <!-- Pillar 3 -->
    <g transform="translate(580, 0)">
      <rect x="0" y="0" width="268" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="0" y="0" width="4" height="34" rx="2" fill="#dc2626" />
      <text x="14" y="15" class="pill-title">Shift-Left DevSecOps</text>
      <text x="14" y="27" class="pill-sub">Checkov SAST · TFLint · Trivy · OIDC Auth</text>
    </g>

    <!-- Pillar 4 -->
    <g transform="translate(870, 0)">
      <rect x="0" y="0" width="268" height="34" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <rect x="0" y="0" width="4" height="34" rx="2" fill="#059669" />
      <text x="14" y="15" class="pill-title">Enterprise AI Platforms</text>
      <text x="14" y="27" class="pill-sub">Azure OpenAI · APIM Gateway · Vector RAG</text>
    </g>
  </g>
</svg>
